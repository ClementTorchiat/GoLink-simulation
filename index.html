<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoLink Simulation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app-container">
    <div id="left-panel">
        <div id="ui-panel">
            <h1>Centre de Contrôle</h1>
            <div id="clock-display">05:00</div>
            <div id="mode-controls" style="display: flex; gap: 5px;">
                <button id="btn-manual" class="active" style="flex: 1;">Manuel</button>
                <button id="btn-auto" style="flex: 1;">Auto</button>
                <button id="btn-heatmap" style="flex: 1; background-color: #34495e; color: white;">Heatmap</button>
            </div>

            <div id="fleet-controls">
                <p style="margin: 0 0 5px 0; font-size: 0.85rem; font-weight: bold; color: #2c3e50;">Ajouter / Retirer un module</p>
                <div style="display: flex; gap: 5px;">
                    <select id="bus-capacity" style="flex: 1; border-radius: 4px; border: 1px solid #bdc3c7; font-family: inherit;">
                        <option value="4">4 places</option>
                        <option value="6">6 places</option>
                        <option value="10">10 places</option>
                        <option value="12">12 places</option>
                    </select>
                    <button id="btn-add-bus" class="btn-blue" style="padding: 5px 10px; width: auto;" title="Créer un module">➕</button>
                    <button id="btn-remove-bus" class="btn-red" style="padding: 5px 10px; width: auto;" title="Retirer un module au dépôt">➖</button>
                    <button id="btn-add-tow" style="padding: 5px 10px; width: auto; background-color: #f1c40f; border:none; border-radius: 4px; cursor:pointer;" title="Déployer une Remorqueuse">Remorqueuse</button>
                </div>
            </div>

            <div id="time-controls">
                <button id="btn-pause" title="Pause">⏸️</button>
                <button id="btn-x1" class="active" title="Vitesse x1">▶️</button>
                <button id="btn-x2" title="Vitesse x2">⏩ x2</button>
                <button id="btn-x5" title="Vitesse x5">⏭️ x5</button>
            </div>
            <div id="stats-panel">
                <p>Flotte globale : <span id="stat-idle">0</span> au repos | <span id="stat-active">0</span> en route</p>
                <p>Convois assemblés : <span id="stat-fusions">0</span></p>
                <p>Énergie économisée : <span id="stat-eco" style="color: #2ecc71; font-weight: bold;">0.00</span> kWh</p>
            </div>
            <button id="btn-spawn">Générer passagers (+)</button>
        </div>
        <div id="canvas-container"></div>
    </div>

    <div id="right-panel">
        <h2>Analytique du Réseau</h2>
        <canvas id="analytics-chart" height="150"></canvas>
        <div style="font-size: 0.75rem; margin-bottom: 15px; text-align: center;">
            <span style="color: #e74c3c; font-weight: bold;">■ Attente</span> |
            <span style="color: #3498db; font-weight: bold;">■ En transit</span> |
            <span style="color: #9b59b6; font-weight: bold;">■ Puissance (kW)</span> |
            <span style="color: #e67e22; font-weight: bold;">■ Fusion (%)</span>
        </div>

        <h2>Télémétrie des Modules</h2>
        <div id="bus-grid"></div>

        <h2>Journal du Réseau</h2>
        <div id="action-log"></div>
    </div>
</div>

<script src="sketch.js"></script>
</body>
</html>
